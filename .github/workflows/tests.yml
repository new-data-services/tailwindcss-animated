name: Tests

on: [push, pull_request]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck

  test-modern:
    name: Node ${{ matrix.node-version }} / Tailwind ${{ matrix.tailwind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        tailwind: ['4.0.7', '^4'] # @tailwindcss/postcss < 4.0.7 has a test runner bug
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install
      - name: Install Tailwind ${{ matrix.tailwind }}
        run: npm install --no-save tailwindcss@${{ matrix.tailwind }} @tailwindcss/postcss@${{ matrix.tailwind }} @tailwindcss/cli@${{ matrix.tailwind }}
      - run: npm test -- jest/index.test.js

  test-legacy:
    name: Node ${{ matrix.node-version }} / Tailwind ${{ matrix.tailwind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        tailwind: ['3.1.0', '^3']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install
      - run: npm install --prefix jest/legacy
      - name: Install Tailwind ${{ matrix.tailwind }}
        run: npm install --no-save --prefix jest/legacy tailwindcss@${{ matrix.tailwind }}
      - run: npm test -- jest/legacy/index.test.js
